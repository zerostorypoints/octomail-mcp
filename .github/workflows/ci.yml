name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      # Absolute home directory paths are the way a contributor's local layout
      # leaks into shipped files. Naming specific private aliases here would
      # publish the very strings the check exists to keep out.
      - name: Check for leaked local paths
        run: '! grep -rnE "/(Users|home)/[a-z]" README.md docs/*.md .env.example accounts.example.json SECURITY.md src/'
